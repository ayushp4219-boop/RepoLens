[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reposage"
version = "0.1.0"
description = "A local-first AI that understands codebases with exact file and line citations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RepoSage Team" }]
dependencies = [
    "typer>=0.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "gitpython>=3.1.40",
    "pathspec>=0.12.1",
    "psycopg[binary,pool]>=3.1.18",
    "pgvector>=0.2.5",
    "rich>=13.7.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
reposage = "reposage.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
